name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）刷新一次 Bangumi 快照
    - cron: "0 2 * * *"

# 允许 GITHUB_TOKEN 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync Bangumi snapshot
        # 抓取失败不会中断部署，会保留仓库里上一次的快照
        continue-on-error: true
        run: node scripts/sync-bangumi.mjs

      - name: Build site
        run: |
          node scripts/build.mjs --base-url "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
