name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）刷新一次 Bangumi 快照并重新构建
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Bangumi snapshot
        # 抓取失败不会中断部署，会保留仓库里上一次的快照
        continue-on-error: true
        run: node scripts/sync-bangumi.mjs

      - name: Sync Steam snapshot
        # 解析 Steam 公开主页；失败时保留仓库里的旧快照
        continue-on-error: true
        run: node scripts/sync-steam.mjs

      - name: Build site
        run: node scripts/build.mjs

      - name: Publish to master
        # 本站的 GitHub Pages 来源是 master 分支根目录。
        # 每次用全新提交覆盖 master，旧历史保留在备份分支里。
        run: |
          cd dist
          touch .nojekyll
          git init -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
